name: Release

on:
  push:
    branches: [main]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image locally
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: reachsky-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan — Trivy (gate HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: reachsky-frontend:${{ github.sha }}
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/reachsky-frontend:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/reachsky-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Job summary
        if: success()
        run: |
          SIZE=$(docker image inspect reachsky-frontend:${{ github.sha }} \
            --format '{{.Size}}' \
            | awk '{printf "%.1f MB", $1/1024/1024}')
          {
            echo "## Release"
            echo "| | |"
            echo "|---|---|"
            echo "| Obraz | \`${{ secrets.DOCKERHUB_USERNAME }}/reachsky-frontend\` |"
            echo "| Tagi | \`${{ github.sha }}\` · \`latest\` |"
            echo "| Rozmiar | \`${SIZE}\` |"
            echo "| Commit | ${{ github.event.head_commit.message }} |"
          } >> "$GITHUB_STEP_SUMMARY"
